packages:
  - "apps/*"
  - "packages/*"

# NOT: `services/*` bilerek workspace dışında bırakılmıştır.
# ADR-003 uyarınca bu dizinler kademeli olarak `apps/api` modüllerine ve
# `apps/worker` job'larına taşınacaktır. Taşınana kadar eski (legacy) kod
# olarak kalırlar ve monorepo build/test grafiğine dahil edilmezler.

# Bağımlılık sürümleri tek yerden yönetilir (pnpm catalog).
# Paketlerde `"next": "catalog:"` şeklinde referans verilir.
catalog:
  # --- Çalışma zamanı ---
  react: ^19.2.0
  react-dom: ^19.2.0
  next: ^16.3.0

  # --- Dil / araçlar ---
  typescript: ^5.9.2
  "@types/node": ^24.3.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0

  # --- Paylaşılan kütüphaneler ---
  zod: ^4.1.5
  "@tanstack/react-query": ^5.90.0
