# 🚀 GitHub Clone - Unified Prometheus Configuration
# Complete microservices monitoring setup

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'githubclone'
    environment: 'production'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Core Service
  - job_name: 'core-service'
    static_configs:
      - targets: ['core-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # File Service
  - job_name: 'file-service'
    static_configs:
      - targets: ['file-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Email Service
  - job_name: 'email-service'
    static_configs:
      - targets: ['email-service:3004']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # SMS Service
  - job_name: 'sms-service'
    static_configs:
      - targets: ['sms-service:3005']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # Notification Service
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3006']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # WordPress Service
  - job_name: 'wordpress-service'
    static_configs:
      - targets: ['wordpress-service:3007']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # WhatsApp Service
  - job_name: 'whatsapp-service'
    static_configs:
      - targets: ['whatsapp-service:3008']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # Telegram Service
  - job_name: 'telegram-service'
    static_configs:
      - targets: ['telegram-service:3009']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # AI Service
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:3010']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Real-time Service
  - job_name: 'realtime-service'
    static_configs:
      - targets: ['realtime-service:3011']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Integration Service
  - job_name: 'integration-service'
    static_configs:
      - targets: ['integration-service:3012']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Nginx Gateway
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    scrape_timeout: 5s

  # cAdvisor (Container Metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    scrape_timeout: 5s
