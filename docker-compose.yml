# 🚀 GitHub Clone - Legacy Docker Compose
# ⚠️  DEPRECATED: Use docker-compose.unified.yml for full microservices
# This file is kept for backward compatibility

version: '3.8'

services:
  # 1. Veritabanı Servisi
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: githubclone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # 2. Backend Servisi (NestJS) - DEPRECATED
  backend:
    container_name: backend_api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/githubclone?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NODE_ENV: "development"
      PROMETHEUS_ENABLED: "true"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules # Performans için node_modules'ı dışarıda bırak
    networks:
      - app-network

  # 3. Frontend Servisi (Next.js)
  frontend:
    container_name: frontend_ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000" # Dışarıda 3001 portunu, container içinde 3000'e yönlendiriyoruz.
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000/graphql" # Tarayıcının göreceği adres
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    networks:
      - app-network

  # 4. SonarQube Servisi
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube_server
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network

  # 5. Prometheus Servisi
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - app-network

  # 6. Grafana Servisi
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_server
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - app-network

  # 7. Redis Servisi
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

# Network ve Volume Tanımlamaları
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
  redis_data:
