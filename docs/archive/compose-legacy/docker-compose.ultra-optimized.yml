version: '3.8'

services:
  # 🚀 Ultra-Optimized API Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: ultra_api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ultra.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - core-service
      - file-service
      - frontend
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.3'
        reservations:
          memory: 48M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🔐 Ultra-Fast Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.ultra
    container_name: ultra_auth_service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://user:password@postgres:5432/githubclone?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=ultra-secure-jwt-secret-256-bit
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.4'
        reservations:
          memory: 96M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ⚡ Ultra-Performance Core Service (GraphQL)
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile.ultra
    container_name: ultra_core_service
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://user:password@postgres:5432/githubclone?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=256
      - GRAPHQL_PLAYGROUND=false
      - GRAPHQL_INTROSPECTION=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.8'
        reservations:
          memory: 192M
          cpus: '0.4'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📁 Ultra-Efficient File Service
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile.ultra
    container_name: ultra_file_service
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JWT_SECRET=ultra-secure-jwt-secret-256-bit
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
      - MAX_FILE_SIZE=5242880
      - UPLOAD_PATH=/app/uploads
    volumes:
      - file_storage:/app/uploads:rw
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.4'
        reservations:
          memory: 96M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🎨 Ultra-Optimized Frontend (Static + CDN Ready)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ultra
    container_name: ultra_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/graphql
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=128
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: '0.3'
        reservations:
          memory: 80M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🗄️ Ultra-Tuned PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ultra_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: githubclone
      # Ultra-performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.8'
        reservations:
          memory: 192M
          cpus: '0.4'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d githubclone"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2

  # ⚡ Ultra-Memory Redis
  redis:
    image: redis:7-alpine
    container_name: ultra_redis
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
    volumes:
      - redis_data:/data
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.2'
        reservations:
          memory: 48M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📊 Ultra-Light Monitoring (Essential Only)
  prometheus:
    image: prom/prometheus:v2.45.0-alpine
    container_name: ultra_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.ultra.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=12h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
    networks:
      - ultra-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.15'

networks:
  ultra-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ultra-bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  file_storage:
    driver: local
  prometheus_data:
    driver: local
