version: '3.8'

services:
  # 🚀 Zookeeper (Minimal)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: kafka_zookeeper_light
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 20
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 6
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 1
      KAFKA_HEAP_OPTS: "-Xmx64m -Xms32m"
    volumes:
      - zookeeper_data_light:/var/lib/zookeeper/data
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

  # ⚡ Kafka Broker (Minimal)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker_light
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 25600
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 25600
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 26214400
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1200000
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 262144
      KAFKA_REPLICA_FETCH_MAX_BYTES: 262144
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 5000
      KAFKA_LOG_FLUSH_OFFSET_CHECKPOINT_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:InitiatingHeapOccupancyPercent=35"
    volumes:
      - kafka_data_light:/var/lib/kafka/data
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 🗄️ PostgreSQL (Minimal)
  db:
    image: postgres:15-alpine
    container_name: postgres_db_light
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: githubclone
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data_light:/var/lib/postgresql/data
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'

  # 🔴 Redis (Minimal)
  redis:
    image: redis:7-alpine
    container_name: redis_light
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    volumes:
      - redis_data_light:/data
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

  # 🔐 Auth Service (Minimal)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_light
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://user:password@db:5432/githubclone
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - db
      - redis
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ⚡ Core Service (Minimal)
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: core_service_light
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://user:password@db:5432/githubclone
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      - db
      - redis
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'

  # 📁 File Service (Minimal)
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    container_name: file_service_light
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - redis
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 📧 Email Service (Minimal)
  email-service:
    build:
      context: ./services/email-service
      dockerfile: Dockerfile
    container_name: email_service_light
    environment:
      - NODE_ENV=production
      - PORT=3004
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=email-service-group
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - kafka
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 📱 SMS Service (Minimal)
  sms-service:
    build:
      context: ./services/sms-service
      dockerfile: Dockerfile
    container_name: sms_service_light
    environment:
      - NODE_ENV=production
      - PORT=3005
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=sms-service-group
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - kafka
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 🔔 Notification Service (Minimal)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification_service_light
    environment:
      - NODE_ENV=production
      - PORT=3006
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=notification-service-group
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - kafka
      - redis
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 🌐 Frontend (Minimal)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_light
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3002/graphql
      - NODE_OPTIONS=--max-old-space-size=256
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'

  # 🌐 Nginx Gateway (Minimal)
  nginx:
    image: nginx:alpine
    container_name: nginx_light
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-light.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - core-service
      - file-service
    networks:
      - light-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

networks:
  light-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: light-bridge

volumes:
  postgres_data_light:
  redis_data_light:
  zookeeper_data_light:
  kafka_data_light:
