# 🚀 Ultra-Optimized PostgreSQL Configuration for Microservices

# 📊 Memory Settings (Optimized for 384MB limit)
shared_buffers = 96MB                    # 25% of total RAM
effective_cache_size = 256MB             # 75% of total RAM
work_mem = 4MB                           # Per-operation memory
maintenance_work_mem = 32MB              # Maintenance operations
wal_buffers = 4MB                        # WAL buffer size

# 🔧 Connection Settings
max_connections = 100                    # Optimized for microservices
superuser_reserved_connections = 3

# 📈 Checkpoint Settings
checkpoint_completion_target = 0.9       # Spread checkpoints
checkpoint_timeout = 15min
checkpoint_warning = 30s
wal_level = replica                      # Minimal WAL for replication
max_wal_size = 1GB
min_wal_size = 80MB

# 🎯 Query Planning
default_statistics_target = 100          # Balance between accuracy and speed
random_page_cost = 1.1                   # SSD optimization
effective_io_concurrency = 200           # SSD optimization
seq_page_cost = 1.0

# ⚡ Parallel Processing
max_worker_processes = 4                 # Match CPU cores
max_parallel_workers_per_gather = 2      # Parallel queries
max_parallel_workers = 4                 # Total parallel workers
max_parallel_maintenance_workers = 2     # Maintenance parallelism

# 🔒 Security & Logging
log_statement = 'none'                   # Minimal logging for performance
log_min_duration_statement = 1000       # Log slow queries only
log_line_prefix = '%t [%p]: '           # Minimal log prefix
log_checkpoints = off                    # Disable checkpoint logging
log_connections = off                    # Disable connection logging
log_disconnections = off                 # Disable disconnection logging

# 🚀 Performance Optimizations
synchronous_commit = on                  # Data safety
fsync = on                              # Data safety
full_page_writes = on                   # Crash safety
wal_compression = on                     # Reduce WAL size
wal_log_hints = off                     # Disable for performance

# 📊 Background Writer
bgwriter_delay = 200ms                   # Frequent background writes
bgwriter_lru_maxpages = 100             # Limit background writes
bgwriter_lru_multiplier = 2.0           # Background write multiplier

# 🔧 Lock Management
deadlock_timeout = 1s                   # Quick deadlock detection
lock_timeout = 0                        # No lock timeout (microservices should be fast)

# 📈 Autovacuum Settings
autovacuum = on                         # Enable autovacuum
autovacuum_max_workers = 2              # Limit autovacuum workers
autovacuum_naptime = 20s               # Frequent autovacuum
autovacuum_vacuum_threshold = 25        # Lower threshold
autovacuum_analyze_threshold = 10       # Lower threshold
autovacuum_vacuum_scale_factor = 0.1    # 10% threshold
autovacuum_analyze_scale_factor = 0.05  # 5% threshold

# 🎯 Query Optimization
enable_hashjoin = on                    # Enable hash joins
enable_mergejoin = on                   # Enable merge joins
enable_nestloop = on                    # Enable nested loop joins
enable_hashagg = on                     # Enable hash aggregation
enable_sort = on                        # Enable sorting

# 📊 Statistics
track_activities = on                   # Track activities
track_counts = on                       # Track counts
track_io_timing = off                   # Disable I/O timing (performance impact)
track_functions = none                  # No function tracking

# 🔧 Other Optimizations
tcp_keepalives_idle = 600               # TCP keepalive
tcp_keepalives_interval = 30            # TCP keepalive interval
tcp_keepalives_count = 3                # TCP keepalive count
