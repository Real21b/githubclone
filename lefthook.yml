# Git hook yönetimi — kurulum: pnpm install (prepare script'i çalıştırır)

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "gitleaks kurulu degil - atlaniyor (CI'da zorunlu calisir)"
        fi

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm turbo typecheck
    test:
      run: pnpm turbo test
