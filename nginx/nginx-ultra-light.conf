# Ultra-Lightweight Nginx Configuration for 10 Users
worker_processes 1;
worker_connections 256;

events {
    worker_connections 256;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Minimal logging
    access_log off;
    error_log /var/log/nginx/error.log error;

    # Ultra-optimized settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    keepalive_requests 50;
    client_max_body_size 5M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Lightweight compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript;

    # Minimal rate limiting
    limit_req_zone $binary_remote_addr zone=api:5m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:5m rate=10r/s;

    # Upstream definitions with minimal keepalive
    upstream frontend {
        server frontend:3000 max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    upstream auth_service {
        server auth-service:3001 max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    upstream core_service {
        server core-service:3002 max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    upstream file_service {
        server file-service:3003 max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Minimal security headers
        add_header X-Frame-Options DENY;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Minimal caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30m;
                add_header Cache-Control "public";
            }
        }

        # Auth service
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # GraphQL API
        location /graphql {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://core_service/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # GraphQL specific
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # File service
        location /files/ {
            limit_req zone=api burst=8 nodelay;
            proxy_pass http://file_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Minimal error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
