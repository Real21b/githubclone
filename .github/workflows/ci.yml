name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Tek kalite kapısı: kurulum, lint, tip kontrolü, derleme, test.
  #
  # NOT: Bu iş bilerek GERÇEKTEN kırılabilir olacak şekilde yazılmıştır.
  # Önceki sürüm yalnızca `ls -la` çalıştırıp "✅ validated" yazıyordu ve
  # hiçbir regresyonu yakalayamıyordu.
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: lockfile ile package.json uyuşmazsa BAŞARISIZ olur.
      # Tekrarlanabilir build'in tek garantisi budur.
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Lint + format (Biome)
        run: pnpm biome ci .

      - name: Tip kontrolü
        run: pnpm turbo typecheck

      - name: Derleme
        run: pnpm turbo build

      - name: Test
        run: pnpm turbo test

      - name: Kapsam raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Güvenlik: bağımlılık açıkları, sır sızıntısı, statik analiz
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks tüm geçmişi tarar

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Bilinen açıkları denetle
        run: pnpm audit --audit-level high
        continue-on-error: true   # Faz 13'te bloke ediciye çevrilecek

      - name: Sır sızıntısı taraması (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dosya sistemi açık taraması (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy sonuçlarını yükle
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ───────────────────────────────────────────────────────────────────────────
  # Docker imajları gerçekten derlenebiliyor mu?
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker imaj derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.app }} imajını derle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # Compose dosyalarının sözdizimi geçerli mi?
  # ───────────────────────────────────────────────────────────────────────────
  compose:
    name: Compose doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Geliştirme yapılandırmasını doğrula
        run: docker compose -f infra/compose.yml config --quiet
        env:
          JWT_SECRET: ci-dogrulama-icin-sahte-deger-0000000000000
          REFRESH_SECRET: ci-dogrulama-icin-sahte-deger-1111111111111
          SESSION_SECRET: ci-dogrulama-icin-sahte-deger-2222222222222

      - name: Üretim yapılandırmasını doğrula
        run: docker compose -f infra/compose.yml -f infra/compose.prod.yml config --quiet
        env:
          JWT_SECRET: ci-dogrulama-icin-sahte-deger-0000000000000
          REFRESH_SECRET: ci-dogrulama-icin-sahte-deger-1111111111111
          SESSION_SECRET: ci-dogrulama-icin-sahte-deger-2222222222222
          POSTGRES_PASSWORD: ci-sahte
          REDIS_PASSWORD: ci-sahte
          GRAFANA_PASSWORD: ci-sahte
          PUBLIC_API_URL: https://api.ornek.com
          PUBLIC_APP_URL: https://ornek.com
