version: '3.8'

services:
  # 🚀 Zookeeper (Kafka için gerekli) - Optimized
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: kafka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 30
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 12
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 2
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ⚡ Kafka Broker (Ultra-optimized)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # 🚀 Performance optimizations
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 51200
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 51200
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 52428800
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 600000
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 524288
      KAFKA_REPLICA_FETCH_MAX_BYTES: 524288
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 5000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 2000
      KAFKA_LOG_FLUSH_OFFSET_CHECKPOINT_INTERVAL_MS: 120000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
        reservations:
          memory: 256M
          cpus: '0.4'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 📊 Kafka UI (Management Interface)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: githubclone-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_JMXPORT: 9101
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'

  # 📈 Kafka Connect (for integrations)
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.0
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
    volumes:
      - kafka_connect_data:/var/lib/kafka-connect
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'

  # 🔔 Notification Service (Kafka Consumer/Producer)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      - NODE_ENV=production
      - PORT=3004
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=notification-service-group
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kafka-network
      - ultra-performance-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 📧 Email Service (Kafka Consumer)
  email-service:
    build:
      context: ./services/email-service
      dockerfile: Dockerfile
    container_name: email_service
    environment:
      - NODE_ENV=production
      - PORT=3005
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=email-service-group
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'
        reservations:
          memory: 96M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 📱 SMS Service (Kafka Consumer)
  sms-service:
    build:
      context: ./services/sms-service
      dockerfile: Dockerfile
    container_name: sms_service
    environment:
      - NODE_ENV=production
      - PORT=3006
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=sms-service-group
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SMS_WEBHOOK_URL=${SMS_WEBHOOK_URL:-http://localhost:3006}
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'
        reservations:
          memory: 96M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🌐 WordPress Service (Kafka Consumer)
  wordpress-service:
    build:
      context: ./services/wordpress-service
      dockerfile: Dockerfile
    container_name: wordpress_service
    environment:
      - NODE_ENV=production
      - PORT=3007
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=wordpress-service-group
      - WORDPRESS_URL=${WORDPRESS_URL:-http://localhost:8080}
      - WORDPRESS_USERNAME=${WORDPRESS_USERNAME}
      - WORDPRESS_PASSWORD=${WORDPRESS_PASSWORD}
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 📱 WhatsApp Service (Kafka Consumer)
  whatsapp-service:
    build:
      context: ./services/whatsapp-service
      dockerfile: Dockerfile
    container_name: whatsapp_service
    environment:
      - NODE_ENV=production
      - PORT=3008
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=whatsapp-service-group
      - WHATSAPP_SESSION_PATH=/app/whatsapp-session
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    volumes:
      - whatsapp_session:/app/whatsapp-session
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 📱 Telegram Service (Kafka Consumer)
  telegram-service:
    build:
      context: ./services/telegram-service
      dockerfile: Dockerfile
    container_name: telegram_service
    environment:
      - NODE_ENV=production
      - PORT=3009
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=telegram-service-group
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-http://localhost:3009/telegram/webhook}
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🤖 AI Service (Kafka Consumer/Producer) - Lightweight
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    environment:
      - NODE_ENV=production
      - PORT=3010
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=ai-service-group
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-pro}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=384
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 🔌 Real-time Communication Service (WebSockets)
  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    container_name: realtime_service
    environment:
      - NODE_ENV=production
      - PORT=3011
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=realtime-service-group
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🔗 Integration Service (Plugin Management)
  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: integration_service
    environment:
      - NODE_ENV=production
      - PORT=3012
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_GROUP_ID=integration-service-group
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PLUGIN_STORAGE_PATH=/app/plugins
      - MARKETPLACE_URL=${MARKETPLACE_URL:-https://marketplace.githubclone.com}
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kafka-network
    volumes:
      - plugin_storage:/app/plugins
      - integration_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🌐 Frontend (Vite - Ultra-optimized)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vite
    container_name: frontend_vite
    environment:
      - NODE_ENV=production
      - VITE_GRAPHQL_URL=http://localhost:3002/graphql
      - VITE_API_URL=http://localhost:3000
      - VITE_REALTIME_URL=http://localhost:3011
      - VITE_INTEGRATION_URL=http://localhost:3012
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  kafka-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: kafka-bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  ultra-performance-network:
    external: true

volumes:
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  kafka_connect_data:
    driver: local
  whatsapp_session:
    driver: local
  plugin_storage:
    driver: local
  integration_logs:
    driver: local
